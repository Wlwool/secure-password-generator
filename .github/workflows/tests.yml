name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check && uv run ruff format --check
      - name: Types (mypy)
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
