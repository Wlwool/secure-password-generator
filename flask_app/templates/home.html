{% extends "base.html" %}

{% block title %}Главная страница{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1 class="card-title">
            <span class="icon icon-lock" aria-hidden="true">🔒</span>
            Генератор паролей
        </h1>
        <p class="card-subtitle">Выберите параметры, чтобы создать надежный пароль</p>
    </div>
    <form action="/generate" method="get" class="generator-form">
        <label for="length">Длина пароля:</label>
        <input type="number" id="length" name="length" value="12" min="{{ min_length }}" max="{{ max_length }}">

        <div class="checkbox-group">
            <label class="checkbox-option">
                <input type="checkbox" name="use_upper" checked>
                <span class="checkbox-icon icon-bolt" aria-hidden="true">⚡</span>
                <span class="checkbox-text">Включить заглавные буквы</span>
            </label>
            <label class="checkbox-option">
                <input type="checkbox" name="use_digits" checked>
                <span class="checkbox-icon icon-hash" aria-hidden="true">#</span>
                <span class="checkbox-text">Включить цифры</span>
            </label>
            <label class="checkbox-option">
                <input type="checkbox" name="use_symbols" checked>
                <span class="checkbox-icon icon-spark" aria-hidden="true">✦</span>
                <span class="checkbox-text">Включить символы</span>
            </label>
        </div>

        <button type="submit">Сгенерировать</button>
    </form>
</div>
{% endblock %}
